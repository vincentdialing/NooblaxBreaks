  <script>
    (async () => {
      const settings = await NB.initPublic('cards');
      if (settings.fb_messenger_url && document.getElementById('messenger-direct-btn')?.tagName === 'A') {
        document.getElementById('messenger-direct-btn').href = settings.fb_messenger_url;
      }
      
      const searchInput = document.getElementById('search');
      const setSelect = document.getElementById('filter-set');
      const raritySelect = document.getElementById('filter-rarity');
      const conditionSelect = document.getElementById('filter-condition');
      const sortSelect = document.getElementById('filter-sort');
      const availableOnlyCheck = document.getElementById('filter-available-only');
      const clearBtn = document.getElementById('btn-clear');
      const resetEmptyBtn = document.getElementById('btn-reset-empty');
      const grid = document.getElementById('cards-grid');
      const emptyState = document.getElementById('empty-state');
      const countLabel = document.getElementById('card-count-label');
      const typeBtns = document.querySelectorAll('.type-btn');

      let selectedType = '';

      // Type pill click handler
      typeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const typeVal = (btn.dataset.type || '').trim();
          const isAlreadyActive = btn.classList.contains('active') && typeVal !== '';

          typeBtns.forEach(b => {
            b.classList.remove('active', 'border-[#1FB5D6]', 'bg-[#1FB5D6]/15', 'text-[#1FB5D6]');
            b.classList.add('border-white/10', 'bg-white/[0.02]', 'text-gray-400');
          });

          if (isAlreadyActive) {
            const allBtn = document.querySelector('.type-btn[data-type=""]');
            if (allBtn) {
              allBtn.classList.add('active', 'border-[#1FB5D6]', 'bg-[#1FB5D6]/15', 'text-[#1FB5D6]');
              allBtn.classList.remove('border-white/10', 'bg-white/[0.02]', 'text-gray-400');
            }
            selectedType = '';
          } else {
            btn.classList.add('active', 'border-[#1FB5D6]', 'bg-[#1FB5D6]/15', 'text-[#1FB5D6]');
            btn.classList.remove('border-white/10', 'bg-white/[0.02]', 'text-gray-400');
            selectedType = typeVal;
          }

          renderCards();
        });
      });

      // Load all cards with automatic Supabase or local fallback
      const allCards = await NB.getCards();

      // Populate distinct sets
      const distinctSets = [...new Set(allCards.map(c => c.set_name).filter(Boolean))].sort();
      distinctSets.forEach(set => {
        const opt = document.createElement('option');
        opt.value = set;
        opt.textContent = set;
        setSelect.appendChild(opt);
      });

      // Populate distinct rarities
      const distinctRarities = [...new Set(allCards.map(c => c.rarity).filter(Boolean))].sort();
      distinctRarities.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        raritySelect.appendChild(opt);
      });

      // Filter and render
      function renderCards() {
        let filtered = [...allCards];

        const q = searchInput.value.toLowerCase().trim();
        const selectedSet = setSelect.value;
        const selectedRarity = raritySelect.value;
        const selectedCondition = conditionSelect.value;
        const availableOnly = availableOnlyCheck.checked;
        const sortMode = sortSelect.value;

        if (q) {
          filtered = filtered.filter(c => 
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.set_name && c.set_name.toLowerCase().includes(q)) ||
            (c.rarity && c.rarity.toLowerCase().includes(q))
          );
        }

        if (selectedSet) {
          filtered = filtered.filter(c => c.set_name === selectedSet);
        }

        if (selectedRarity) {
          filtered = filtered.filter(c => c.rarity === selectedRarity);
        }

        if (selectedCondition) {
          filtered = filtered.filter(c => c.condition && c.condition.includes(selectedCondition));
        }

        if (availableOnly) {
          filtered = filtered.filter(c => !c.is_sold);
        }

        if (selectedType) {
          filtered = filtered.filter(c => NB.matchesType(c, selectedType));
        }

        // Sorting
        if (sortMode === 'price_desc') {
          filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
        } else if (sortMode === 'price_asc') {
          filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
        } else if (sortMode === 'name') {
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        } else {
          // Keep the custom arranged order from getCards() while grouping featured if needed
          // Stable sort maintains the custom order defined in the admin portal
        }

        // Update count label
        countLabel.textContent = `Showing ${filtered.length} of ${allCards.length} collectible cards`;

        if (filtered.length === 0) {
          grid.innerHTML = '';
          emptyState.classList.remove('hidden');
        } else {
          emptyState.classList.add('hidden');
          grid.innerHTML = filtered.map(c => NB.card(c, settings)).join('');
        }
        // Update mobile filter badge
        updateMobileFilterBadge();
      }

      // Mobile collapsible filter toggle
      const filterHeader = document.getElementById('filter-header-toggle');
      const filterBody = document.getElementById('filter-body');
      const filterChevron = document.getElementById('filter-chevron');
      const mobileFilterBadge = document.getElementById('mobile-filter-badge');

      let isMobileFilterOpen = false;
      function toggleMobileFilter() {
        if (window.innerWidth >= 1024) return;
        isMobileFilterOpen = !isMobileFilterOpen;
        if (isMobileFilterOpen) {
          filterBody.classList.remove('hidden');
          filterChevron.classList.add('rotate-180');
        } else {
          filterBody.classList.add('hidden');
          filterChevron.classList.remove('rotate-180');
        }
        updateMobileFilterBadge();
      }

      function updateMobileFilterBadge() {
        if (window.innerWidth >= 1024 || !mobileFilterBadge) return;
        let activeCount = 0;
        if (selectedType) activeCount++;
        if (searchInput.value.trim()) activeCount++;
        if (setSelect.value) activeCount++;
        if (raritySelect.value) activeCount++;
        if (conditionSelect.value) activeCount++;
        if (availableOnlyCheck.checked) activeCount++;
        if (sortSelect.value !== 'featured') activeCount++;

        if (activeCount > 0) {
          mobileFilterBadge.textContent = `${activeCount} ACTIVE`;
          mobileFilterBadge.className = 'lg:hidden font-pixel text-[7px] text-[#1FB5D6] bg-[#1FB5D6]/20 border border-[#1FB5D6]/50 px-2 py-0.5 rounded-full transition-colors';
        } else {
          mobileFilterBadge.textContent = '';
          mobileFilterBadge.className = 'hidden';
        }
      }

      if (filterHeader) {
        filterHeader.addEventListener('click', (e) => {
          if (e.target.closest('#btn-clear')) return;
          toggleMobileFilter();
        });
      }

      // Initial render
      renderCards();

      // Listeners
      searchInput.addEventListener('input', renderCards);
      setSelect.addEventListener('change', renderCards);
      raritySelect.addEventListener('change', renderCards);
      conditionSelect.addEventListener('change', renderCards);
      sortSelect.addEventListener('change', renderCards);
      availableOnlyCheck.addEventListener('change', renderCards);

      function resetFilters() {
        searchInput.value = '';
        setSelect.value = '';
        raritySelect.value = '';
        conditionSelect.value = '';
        availableOnlyCheck.checked = false;
        sortSelect.value = 'featured';
        selectedType = '';
        typeBtns.forEach(b => {
          b.classList.remove('active', 'border-[#1FB5D6]', 'bg-[#1FB5D6]/15', 'text-[#1FB5D6]');
          b.classList.add('border-white/10', 'bg-white/[0.02]', 'text-gray-400');
        });
        const allBtn = document.querySelector('.type-btn[data-type=""]');
        if (allBtn) {
          allBtn.classList.add('border-[#1FB5D6]', 'bg-[#1FB5D6]/15', 'text-[#1FB5D6]');
          allBtn.classList.remove('border-white/10', 'bg-white/[0.02]', 'text-gray-400');
        }
        renderCards();
      }

      clearBtn.addEventListener('click', resetFilters);
      resetEmptyBtn.addEventListener('click', resetFilters);

    })();
  </script>
