  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script>
    (async () => {
      const settings = await NB.initPublic('cards');
      if (settings.fb_messenger_url) {
        document.getElementById('messenger-direct-btn').href = settings.fb_messenger_url;
      }
      
      const searchInput = document.getElementById('search');
      const setSelect = document.getElementById('filter-set');
      const raritySelect = document.getElementById('filter-rarity');
      const conditionSelect = document.getElementById('filter-condition');
      const sortSelect = document.getElementById('filter-sort');
      const availableOnlyCheck = document.getElementById('filter-available-only');
      const clearBtn = document.getElementById('btn-clear');
      const resetEmptyBtn = document.getElementById('btn-reset-empty');
      const grid = document.getElementById('cards-grid');
      const emptyState = document.getElementById('empty-state');
      const countLabel = document.getElementById('card-count-label');

      // Load all cards with automatic Supabase or local fallback
      const allCards = await NB.getCards();

      // Populate distinct sets
      const distinctSets = [...new Set(allCards.map(c => c.set_name).filter(Boolean))].sort();
      distinctSets.forEach(set => {
        const opt = document.createElement('option');
        opt.value = set;
        opt.textContent = set;
        setSelect.appendChild(opt);
      });

      // Populate distinct rarities
      const distinctRarities = [...new Set(allCards.map(c => c.rarity).filter(Boolean))].sort();
      distinctRarities.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        raritySelect.appendChild(opt);
      });

      // Filter and render
      function renderCards() {
        let filtered = [...allCards];

        const q = searchInput.value.toLowerCase().trim();
        const selectedSet = setSelect.value;
        const selectedRarity = raritySelect.value;
        const selectedCondition = conditionSelect.value;
        const availableOnly = availableOnlyCheck.checked;
        const sortMode = sortSelect.value;

        if (q) {
          filtered = filtered.filter(c => 
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.set_name && c.set_name.toLowerCase().includes(q)) ||
            (c.rarity && c.rarity.toLowerCase().includes(q))
          );
        }

        if (selectedSet) {
          filtered = filtered.filter(c => c.set_name === selectedSet);
        }

        if (selectedRarity) {
          filtered = filtered.filter(c => c.rarity === selectedRarity);
        }

        if (selectedCondition) {
          filtered = filtered.filter(c => c.condition && c.condition.includes(selectedCondition));
        }

        if (availableOnly) {
          filtered = filtered.filter(c => !c.is_sold);
        }

        // Sorting
        if (sortMode === 'price_desc') {
          filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
        } else if (sortMode === 'price_asc') {
          filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
        } else if (sortMode === 'name') {
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        } else {
          filtered.sort((a, b) => (b.is_featured ? 1 : 0) - (a.is_featured ? 1 : 0));
        }

        // Update count label
        countLabel.textContent = `Showing ${filtered.length} of ${allCards.length} collectible cards`;

        if (filtered.length === 0) {
          grid.innerHTML = '';
          emptyState.classList.remove('hidden');
        } else {
          emptyState.classList.add('hidden');
          grid.innerHTML = filtered.map(c => NB.card(c, settings)).join('');
        }
      }

      // Initial render
      renderCards();

      // Listeners
      searchInput.addEventListener('input', renderCards);
      setSelect.addEventListener('change', renderCards);
      raritySelect.addEventListener('change', renderCards);
      conditionSelect.addEventListener('change', renderCards);
      sortSelect.addEventListener('change', renderCards);
      availableOnlyCheck.addEventListener('change', renderCards);

      function resetFilters() {
        searchInput.value = '';
        setSelect.value = '';
        raritySelect.value = '';
        conditionSelect.value = '';
        availableOnlyCheck.checked = false;
        sortSelect.value = 'featured';
        renderCards();
      }

      clearBtn.addEventListener('click', resetFilters);
      resetEmptyBtn.addEventListener('click', resetFilters);

    })();
  </script>
