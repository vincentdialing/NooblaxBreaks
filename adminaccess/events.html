<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Events Showcase | Nooblax Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            pixel: ['"Press Start 2P"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="assets/LOGO_NB.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-[#0B1120] text-gray-100 font-sans min-h-screen">

  <div id="admin-topbar-container"></div>
  <div id="admin-sidebar-container"></div>

  <main class="md:ml-64 p-3.5 sm:p-6 lg:p-10 max-w-7xl">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 sm:mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Events & Tourney Proof</h1>
        <p class="text-xs sm:text-sm text-gray-400 mt-1">Manage real event photos, venues, and tournament participation proofs displayed on the homepage hero.</p>
      </div>
      <a href="event-form.html" class="w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-5 py-2.5 sm:py-3 rounded-xl bg-gradient-to-r from-[#0E839E] to-[#1FB5D6] hover:from-[#129ab8] hover:to-[#29c8eb] text-white text-sm font-bold shadow-lg shadow-[#0E839E]/30 transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>Add New Event</span>
      </a>
    </div>

    <!-- Events Grid -->
    <div id="events-list-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
      <div class="col-span-full py-12 text-center text-gray-500">Loading events from Supabase...</div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4.0"></script>
  <script src="js/admin.js?v=4.0"></script>
  <script>
    async function loadEvents() {
      const container = document.getElementById('events-list-container');
      try {
        const { data, error } = await supabaseClient
          .from('events')
          .select('*')
          .order('id', { ascending: true });

        if (error) throw error;

        if (!data || !data.length) {
          container.innerHTML = '<div class="col-span-full py-12 text-center text-gray-500">No events found in Supabase. Click "Add New Event" to create one.</div>';
          return;
        }

        container.innerHTML = data.map(ev => `
          <div class="bg-[#0A1020] border border-white/10 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between group hover:border-[#1FB5D6]/40 transition-all">
            <div>
              <div class="aspect-[16/10] bg-[#050914] relative overflow-hidden">
                <img src="${ev.image_url || ev.image || '/assets/placeholder.svg'}" onerror="this.src='${ev.fallback_url || ''}'" alt="${Admin.esc(ev.title)}" class="w-full h-full object-cover">
                <span class="absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-md text-[10px] font-bold text-[#1FB5D6] border border-white/10">
                  ${Admin.esc(ev.date || 'TBD')}
                </span>
              </div>
              <div class="p-5">
                <h3 class="font-bold text-white text-base mb-1">${Admin.esc(ev.title)}</h3>
                <div class="text-xs text-[#1FB5D6] flex items-center space-x-1 mb-3">
                  <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  <span>${Admin.esc(ev.location)}</span>
                </div>
                <p class="text-xs text-gray-400 line-clamp-2">${Admin.esc(ev.description || 'No description')}</p>
              </div>
            </div>
            <div class="p-4 border-t border-white/10 flex items-center justify-end space-x-2 bg-white/[0.01]">
              <a href="event-form.html?id=${ev.id}" class="text-xs font-bold text-[#1FB5D6] hover:text-white px-3.5 py-2 rounded-lg bg-[#0E839E]/20 hover:bg-[#0E839E]/40 transition-colors">Edit</a>
              <button onclick="deleteEvent(${ev.id})" class="text-xs font-bold text-rose-400 hover:text-rose-300 px-3.5 py-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 transition-colors">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading events:', err);
        container.innerHTML = `<div class="col-span-full py-12 text-center text-rose-400">Failed to load events: ${Admin.esc(err.message)}</div>`;
      }
    }

    async function deleteEvent(id) {
      if (!confirm('Are you sure you want to delete this event?')) return;
      try {
        const { error } = await supabaseClient.from('events').delete().eq('id', id);
        if (error) throw error;
        Admin.toast('Event deleted successfully', 'success');
        loadEvents();
      } catch (err) {
        console.error('Delete error:', err);
        Admin.toast('Failed to delete: ' + err.message, 'error');
      }
    }

    (async () => {
      const session = await Admin.initPage('events');
      if (!session) return;
      loadEvents();
    })();
  </script>
</body>
</html>
