<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Nooblax Portal</title>
  <script>
    if (window.location.protocol.startsWith('http') && window.location.pathname === '/adminaccess') {
      window.location.replace('/adminaccess/' + window.location.search + window.location.hash);
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            pixel: ['"Press Start 2P"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/png" href="assets/LOGO_NB.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-[#0B1120] text-gray-100 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient background glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-[#0E839E]/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-[#1FB5D6]/15 rounded-full blur-[140px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <div class="bg-[#0B1220]/90 border border-white/10 rounded-3xl p-8 sm:p-10 backdrop-blur-2xl shadow-2xl shadow-black/80">
      
      <!-- Brand & Title -->
      <div class="text-center mb-8">
        <img src="assets/LOGO_NB.png" alt="Nooblax Breaks" class="h-20 sm:h-24 w-auto mx-auto mb-4 object-contain drop-shadow-[0_8px_24px_rgba(0,0,0,0.6)] drop-shadow-[0_0_16px_rgba(246,208,111,0.25)]">
        <h1 class="font-pixel brand-logo-text brand-text-gradient text-xs sm:text-sm tracking-wider">NOOBLAX BREAKS</h1>
        <p class="text-[10px] sm:text-xs text-[#1FB5D6] font-semibold tracking-widest uppercase mt-2">Management Portal</p>
      </div>

      <!-- Login Form -->
      <form id="admin-login-form" class="space-y-5" onsubmit="return false;">
        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Email Address</label>
          <input type="text" id="login-email" required placeholder="admin@example.com" autocomplete="username"
                 class="w-full bg-[#050914] border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-[#1FB5D6] focus:ring-1 focus:ring-[#1FB5D6] transition-all">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" 
                   class="w-full bg-[#050914] border border-white/10 rounded-xl pl-4 pr-12 py-3.5 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-[#1FB5D6] focus:ring-1 focus:ring-[#1FB5D6] transition-all">
            <button type="button" id="toggle-password-btn" onclick="togglePasswordVisibility(event)" aria-label="Toggle password visibility" title="Show/Hide password"
                    class="absolute inset-y-0 right-0 w-12 h-full flex items-center justify-center text-gray-400 hover:text-[#1FB5D6] transition-colors focus:outline-none cursor-pointer select-none z-20">
              <!-- Eye Open (show password) -->
              <svg id="eye-icon" class="w-5 h-5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Closed / Slash (hide password) -->
              <svg id="eye-slash-icon" class="w-5 h-5 hidden pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Inline Error Alert Box -->
        <div id="login-error-box" class="hidden p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-start space-x-2.5">
          <svg class="w-4 h-4 flex-shrink-0 mt-0.5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div id="login-error-msg" class="flex-1 leading-relaxed"></div>
        </div>

        <button type="submit" id="login-submit-btn" 
                class="w-full py-4 px-6 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-[#0E839E] to-[#1FB5D6] hover:from-[#129ab8] hover:to-[#29c8eb] shadow-lg shadow-[#0E839E]/30 transition-all duration-200 transform active:scale-[0.99] flex items-center justify-center space-x-2">
          <span>Sign In to Dashboard</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="mt-8 pt-6 border-t border-white/10 text-center">
        <p class="text-xs text-gray-500">Authorized personnel only.</p>
      </div>
    </div>
  </div>

  <!-- Synchronous Password Visibility Helper (never waits for async network calls) -->
  <script>
    function togglePasswordVisibility(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }
      const input = document.getElementById('login-password');
      const eye = document.getElementById('eye-icon');
      const slash = document.getElementById('eye-slash-icon');
      if (!input) return false;

      if (input.type === 'password') {
        input.type = 'text';
        if (eye) eye.classList.add('hidden');
        if (slash) slash.classList.remove('hidden');
      } else {
        input.type = 'password';
        if (eye) eye.classList.remove('hidden');
        if (slash) slash.classList.add('hidden');
      }
      return false;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=4.0"></script>
  <script src="js/admin.js?v=4.0"></script>
  <script>
    (function() {
      const form = document.getElementById('admin-login-form');
      const submitBtn = document.getElementById('login-submit-btn');
      const errorBox = document.getElementById('login-error-box');
      const errorMsg = document.getElementById('login-error-msg');
      let isSubmitting = false;

      // Safe escape helper (never relies on external scripts)
      function safeEsc(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Safe toast notification helper
      function safeToast(msg, type = 'error') {
        try {
          if (typeof Admin !== 'undefined' && typeof Admin.toast === 'function') {
            Admin.toast(msg, type);
            return;
          }
        } catch (_) {}
        const el = document.createElement('div');
        const color = type === 'success' ? 'from-emerald-600 to-teal-500 border-emerald-400' : 'from-red-600 to-rose-500 border-red-400';
        el.className = `fixed top-6 right-6 z-50 px-5 py-3.5 rounded-2xl text-white font-sans text-sm font-semibold shadow-2xl bg-gradient-to-r ${color} border backdrop-blur-xl transition-all duration-300`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }

      // Direct Supabase token endpoint call
      async function attemptSupabaseLogin(targetEmail, targetPassword, signal) {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          signal: signal,
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: targetEmail, password: targetPassword })
        });

        let data = null;
        try {
          data = await res.json();
        } catch (_) {
          const rawText = await res.text().catch(() => '');
          throw new Error(rawText || `Network response not JSON (Status ${res.status})`);
        }

        if (!res.ok) {
          const rawMsg = data.error_description || data.msg || data.message || `Login failed (${res.status})`;
          const err = new Error(rawMsg);
          err.status = res.status;
          err.data = data;
          throw err;
        }

        return data;
      }

      // Hide error box when user edits inputs
      ['login-email', 'login-password'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', () => {
            if (errorBox) errorBox.classList.add('hidden');
          });
        }
      });

      // Synchronously attach submit listener
      form.addEventListener('submit', async function(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }

        if (isSubmitting) return;

        const rawInput = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!rawInput || !password) {
          errorMsg.innerHTML = '<span class="font-semibold text-red-200">Missing Information:</span> Please enter both email and password.';
          errorBox.classList.remove('hidden');
          return;
        }

        // SMART EMAIL NORMALIZATION:
        // 1. If user entered @nooblax.tcg, convert to registered @nooblaxbreaks.com
        // 2. If user entered username only ('princepaolo' or 'admin'), append @nooblaxbreaks.com
        let email = rawInput.toLowerCase();
        if (email.endsWith('@nooblax.tcg')) {
          email = email.replace(/@nooblax\.tcg$/, '@nooblaxbreaks.com');
        } else if (!email.includes('@')) {
          email = email + '@nooblaxbreaks.com';
        }

        isSubmitting = true;
        errorBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Signing in...</span>
        `;

        let isSuccessRedirect = false;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);

        try {
          let authData = null;
          let lastErr = null;

          // Attempt 1: With the normalized email
          try {
            authData = await attemptSupabaseLogin(email, password, controller.signal);
          } catch (err1) {
            lastErr = err1;
            // Attempt 2 Fallback: If credentials failed and this was princepaolo or admin, try the alternate
            const isCredFail = (err1.message || '').toLowerCase().includes('invalid') || (err1.message || '').toLowerCase().includes('credentials');
            if (isCredFail) {
              const altEmail = email.startsWith('princepaolo@') 
                ? 'admin@nooblaxbreaks.com' 
                : (email.startsWith('admin@') ? 'princepaolo@nooblaxbreaks.com' : null);

              if (altEmail) {
                try {
                  authData = await attemptSupabaseLogin(altEmail, password, controller.signal);
                  lastErr = null;
                } catch (_) {
                  // Keep original error
                }
              }
            }
          }

          if (!authData && lastErr) {
            throw lastErr;
          }

          clearTimeout(timeoutId);

          // Save session to localStorage so subsequent pages load instantly
          try {
            const storageKey = `sb-${SUPABASE_URL.split('//')[1].split('.')[0]}-auth-token`;
            localStorage.setItem(storageKey, JSON.stringify({
              access_token: authData.access_token,
              refresh_token: authData.refresh_token,
              expires_at: Math.floor(Date.now() / 1000) + (authData.expires_in || 3600),
              expires_in: authData.expires_in || 3600,
              token_type: authData.token_type || 'bearer',
              user: authData.user
            }));
          } catch (storageErr) {
            console.warn('Storage error:', storageErr);
          }

          // Sync with supabaseClient if available
          if (typeof supabaseClient !== 'undefined' && supabaseClient && supabaseClient.auth) {
            try {
              await Promise.race([
                supabaseClient.auth.setSession({
                  access_token: authData.access_token,
                  refresh_token: authData.refresh_token
                }),
                new Promise(r => setTimeout(r, 800))
              ]);
            } catch (_) {}
          }

          isSuccessRedirect = true;
          safeToast('Login successful! Redirecting...', 'success');
          submitBtn.innerHTML = '<span>Success! Redirecting...</span>';

          setTimeout(() => {
            const dest = window.location.pathname.includes('/adminaccess') ? 'dashboard.html' : 'dashboard.html';
            window.location.href = dest;
          }, 350);

        } catch (err) {
          clearTimeout(timeoutId);
          console.error('Login error:', err);

          let friendlyMsg = 'Invalid email or password. Please try again.';
          const lowMsg = ((err && err.message) || '').toLowerCase();

          if (err.name === 'AbortError' || lowMsg.includes('abort') || lowMsg.includes('timeout')) {
            friendlyMsg = 'Connection timed out. Please check your network and try again.';
          } else if (lowMsg.includes('invalid login credentials') || lowMsg.includes('invalid_grant') || lowMsg.includes('invalid') || lowMsg.includes('credentials')) {
            friendlyMsg = 'Invalid email or password. Please try again.';
          } else if (lowMsg.includes('failed to fetch') || lowMsg.includes('networkerror')) {
            friendlyMsg = 'Network connection error. Please check your internet connection.';
          }

          safeToast(friendlyMsg, 'error');
          errorMsg.innerHTML = `<span class="font-bold text-red-200">Login Failed:</span> ${safeEsc(friendlyMsg)}`;
          errorBox.classList.remove('hidden');

        } finally {
          if (!isSuccessRedirect) {
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In to Dashboard</span><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
          }
        }
      });

      // Background check if user is already logged in (never blocks form listeners)
      setTimeout(async () => {
        try {
          if (typeof Admin !== 'undefined' && Admin.checkAuth) {
            const session = await Admin.checkAuth();
            if (session) {
              window.location.href = 'dashboard.html';
            }
          }
        } catch (e) {
          console.warn('Initial session check:', e);
        }
      }, 500);
    })();
  </script>
</body>
</html>
