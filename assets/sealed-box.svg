<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6D06F" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0E839E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F6D06F"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e33"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="600" rx="36" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="596" height="596" rx="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="300" cy="300" r="260" fill="url(#ambientGlow)"/>

  <!-- Inner Vault Frame -->
  <rect x="24" y="24" width="552" height="552" rx="28" fill="rgba(255,255,255,0.015)" stroke="rgba(246,208,111,0.2)" stroke-width="1.5"/>

  <!-- 3D Isometric Booster Display Vault -->
  <g transform="translate(300, 290)">
    <!-- Cast Shadow -->
    <ellipse cx="0" cy="150" rx="190" ry="46" fill="#000000" opacity="0.65"/>

    <!-- Top Isometric Plane -->
    <polygon points="0,-130 160,-50 0,30 -160,-50" fill="url(#boxTop)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

    <!-- Left Isometric Plane -->
    <polygon points="-160,-50 0,30 0,165 -160,85" fill="url(#boxLeft)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- Right Isometric Plane -->
    <polygon points="0,30 160,-50 160,85 0,165" fill="url(#boxRight)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Factory Sealed Security Band (Gold Wrap) -->
    <polygon points="0,-80 65,-48 0,-15 -65,-48" fill="url(#goldSheen)" opacity="0.88"/>
    <polygon points="-65,-48 0,-15 0,65 -65,32" fill="url(#goldSheen)" opacity="0.75"/>
    <polygon points="0,-15 65,-48 65,32 0,65" fill="url(#goldSheen)" opacity="0.92"/>

    <!-- Central Security Hologram Medallion -->
    <circle cx="0" cy="10" r="38" fill="url(#goldSheen)" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="10" r="32" fill="#0B1120" stroke="rgba(246,208,111,0.5)" stroke-width="1.5"/>
    <path d="M-12,18 L0,-12 L12,18 L6,18 L0,3 L-6,18 Z" fill="url(#goldSheen)"/>
    <circle cx="0" cy="10" r="4" fill="#1FB5D6"/>

    <!-- Subtle Cyan Edge Laser Highlights -->
    <line x1="-120" y1="50" x2="-25" y2="98" stroke="#1FB5D6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="25" y1="98" x2="120" y2="50" stroke="#1FB5D6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Clear, Modern, High-Legibility Title Badge -->
  <g transform="translate(300, 505)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(6,10,20,0.85)" stroke="rgba(246,208,111,0.35)" stroke-width="1.5"/>
    <circle cx="-115" cy="0" r="4" fill="#F6D06F"/>
    <text x="-95" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2">FACTORY SEALED</text>
  </g>
</svg>
