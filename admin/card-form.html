<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDIT CARD | Nooblax Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          teal: { DEFAULT: '#0E839E', light: '#1FB5D6', dark: '#0A6B82' },
          cream: { DEFAULT: '#F6D06F', light: '#FFDF85' },
          cherry: { DEFAULT: '#E63946', light: '#EE3F3F' },
          ink: { DEFAULT: '#1A1E24' },
          shell: { DEFAULT: '#ECEFF1' },
          base: { DEFAULT: '#FAFAFA', light: '#F4F6F8' }
        },
        fontFamily: {
          pixel: ['"Press Start 2P"', 'cursive'],
          body: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          sans: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"Space Grotesk"', 'ui-monospace', 'monospace']
        }
      }
    }
  }
  </script>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/LOGO_NB.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="font-body bg-[#0B1120] text-gray-200">
  <!-- Admin mobile topbar -->
  <div id="admin-topbar"></div>
  <!-- Admin desktop sidebar -->
  <div id="admin-sidebar"></div>
  
  <!-- Main content area -->
  <div class="md:ml-64 min-h-screen bg-[#0B1120]">
    <div class="p-6 md:p-8 fade-in">
      <div class="mb-6">
        <a href="/admin/cards.html" class="text-[#1FB5D6] hover:text-white transition-colors font-body text-sm font-semibold mb-2 inline-block">&larr; Back to Cards</a>
        <h1 id="page-title" class="text-white font-pixel text-sm">ADD NEW CARD</h1>
      </div>
      
      <div id="loading" class="text-center py-10 font-pixel text-[10px] text-gray-500 hidden">LOADING...</div>

      <div id="form-container" class="bg-white/[0.04] backdrop-blur-xl rounded-2xl border border-white/[0.06] p-6 max-w-3xl">
        <form id="card-form" class="space-y-4">
          <div>
            <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Name</label>
            <input type="text" id="name" name="name" required class="w-full p-3 font-body">
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Set Name</label>
              <input type="text" id="set_name" name="set_name" class="w-full p-3 font-body">
            </div>
            <div>
              <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Price</label>
              <input type="number" id="price" name="price" step="0.01" min="0" required class="w-full p-3 font-body">
            </div>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Rarity</label>
              <select id="rarity" name="rarity" class="w-full p-3 font-body text-ink"></select>
            </div>
            <div>
              <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Condition</label>
              <select id="condition" name="condition" class="w-full p-3 font-body text-ink"></select>
            </div>
          </div>
          
          <div>
            <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Description</label>
            <textarea id="description" name="description" rows="4" class="w-full p-3 font-body"></textarea>
          </div>
          
          <div>
            <label class="block font-pixel text-[7px] text-gray-500 uppercase mb-1">Image</label>
            <input type="file" id="image" name="image" accept="image/*" class="w-full p-3 font-body">
            <div id="image-preview-container" class="mt-4 hidden">
              <p class="font-pixel text-[7px] text-gray-500 mb-2">CURRENT IMAGE:</p>
              <img id="image-preview" src="" class="w-32 h-auto rounded-xl border border-white/[0.1]">
            </div>
          </div>
          
          <div class="flex items-center gap-6 mt-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="is_featured" name="is_featured" class="w-5 h-5 accent-teal cursor-pointer">
              <span class="font-pixel text-[8px] text-gray-300">FEATURED</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="is_sold" name="is_sold" class="w-5 h-5 accent-cherry cursor-pointer">
              <span class="font-pixel text-[8px] text-gray-300">SOLD</span>
            </label>
          </div>
          
          <div class="pt-6 border-t border-white/[0.06] mt-6">
            <button type="submit" id="submit-btn" class="bg-gradient-to-r from-[#0E839E] to-[#1FB5D6] text-white font-pixel text-[9px] px-8 py-3 rounded-xl hover:shadow-[0_4px_20px_rgba(14,131,158,0.4)] transition-all duration-300">SAVE CARD</button>
            <a href="/admin/cards.html" class="inline-block ml-4 font-body text-sm font-semibold text-gray-500 hover:text-gray-300 transition-colors">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script>
    (async () => {
      const ctx = await NB.initAdmin('cards');
      if (!ctx) return;
      
      const id = new URLSearchParams(window.location.search).get('id');
      let card = null;
      
      const form = document.getElementById('card-form');
      const raritySelect = document.getElementById('rarity');
      const conditionSelect = document.getElementById('condition');
      
      // Populate selects
      NB.RARITIES.forEach(r => {
        const option = document.createElement('option');
        option.value = r; option.textContent = r;
        raritySelect.appendChild(option);
      });
      NB.CONDITIONS.forEach(c => {
        const option = document.createElement('option');
        option.value = c; option.textContent = c;
        conditionSelect.appendChild(option);
      });
      
      if (id) {
        document.getElementById('page-title').textContent = 'EDIT CARD';
        document.title = 'EDIT CARD | Nooblax Admin';
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('form-container').classList.add('hidden');
        
        try {
          const { data, error } = await supabaseClient.from('cards').select('*').eq('id', id).single();
          if (error) throw error;
          card = data;
          
          form.name.value = card.name || '';
          form.set_name.value = card.set_name || '';
          form.price.value = card.price || 0;
          form.rarity.value = card.rarity || NB.RARITIES[0];
          form.condition.value = card.condition || NB.CONDITIONS[0];
          form.description.value = card.description || '';
          form.is_featured.checked = card.is_featured || false;
          form.is_sold.checked = card.is_sold || false;
          
          if (card.image_url) {
            document.getElementById('image-preview-container').classList.remove('hidden');
            document.getElementById('image-preview').src = NB.img(card.image_url);
          }
        } catch (err) {
          console.error(err);
          NB.toast('Error loading card.', 'error');
        } finally {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('form-container').classList.remove('hidden');
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'SAVING...';
        
        try {
          let image_url = card?.image_url || null;
          
          const fileInput = document.getElementById('image');
          if (fileInput.files.length > 0) {
            if (card?.image_url) {
              await NB.deleteCardImage(card.image_url);
            }
            image_url = await NB.uploadCardImage(fileInput.files[0]);
          }
          
          const cardData = {
            name: form.name.value,
            set_name: form.set_name.value,
            rarity: form.rarity.value,
            price: parseFloat(form.price.value) || 0,
            condition: form.condition.value,
            description: form.description.value,
            image_url,
            is_featured: form.is_featured.checked,
            is_sold: form.is_sold.checked,
          };
          
          if (id) {
            const { error } = await supabaseClient.from('cards').update(cardData).eq('id', id);
            if (error) throw error;
          } else {
            const { error } = await supabaseClient.from('cards').insert(cardData);
            if (error) throw error;
          }
          
          NB.toast('Card saved!', 'success');
          setTimeout(() => {
            window.location.href = '/admin/cards.html';
          }, 1000);
          
        } catch (err) {
          console.error(err);
          NB.toast('Error saving card.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'SAVE CARD';
        }
      });
    })();
  </script>
</body>
</html>
