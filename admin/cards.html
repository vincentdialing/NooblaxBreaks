<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANAGE CARDS | Nooblax Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          teal: { DEFAULT: '#0E839E', light: '#1FB5D6', dark: '#0A6B82' },
          cream: { DEFAULT: '#F6D06F', light: '#FFDF85' },
          cherry: { DEFAULT: '#E63946', light: '#EE3F3F' },
          ink: { DEFAULT: '#1A1E24' },
          shell: { DEFAULT: '#ECEFF1' },
          base: { DEFAULT: '#FAFAFA', light: '#F4F6F8' }
        },
        fontFamily: {
          pixel: ['"Press Start 2P"', 'cursive'],
          body: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          sans: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"Space Grotesk"', 'ui-monospace', 'monospace']
        }
      }
    }
  }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="font-body bg-[#0B1120] text-gray-200">
  <!-- Admin mobile topbar -->
  <div id="admin-topbar"></div>
  <!-- Admin desktop sidebar -->
  <div id="admin-sidebar"></div>
  
  <!-- Main content area -->
  <div class="md:ml-64 min-h-screen bg-[#0B1120]">
    <div class="p-6 md:p-8 fade-in">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-white font-pixel text-sm">MANAGE CARDS</h1>
        <a href="/admin/card-form.html" class="bg-gradient-to-r from-[#0E839E] to-[#1FB5D6] text-white font-pixel text-[9px] py-3 px-6 rounded-xl hover:shadow-[0_4px_20px_rgba(14,131,158,0.4)] transition-all duration-300">ADD NEW CARD</a>
      </div>
      
      <div id="loading" class="text-center py-10 font-pixel text-[10px] text-gray-500">LOADING CARDS...</div>

      <div id="content" class="hidden">
        <div class="table-wrapper w-full border border-white/[0.06] rounded-2xl overflow-x-auto bg-white/[0.04] backdrop-blur-xl">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead>
              <tr class="bg-white/[0.04] text-gray-400 font-pixel text-[7px]">
                <th class="py-3 px-3">#</th>
                <th class="py-3 px-3">IMAGE</th>
                <th class="py-3 px-3">NAME</th>
                <th class="py-3 px-3">SET</th>
                <th class="py-3 px-3">RARITY</th>
                <th class="py-3 px-3">PRICE</th>
                <th class="py-3 px-3">CONDITION</th>
                <th class="py-3 px-3">FEATURED</th>
                <th class="py-3 px-3">STATUS</th>
                <th class="py-3 px-3">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="cards-table">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script>
    let currentCards = [];
    
    async function deleteCard(id) {
      if (!confirm('Are you sure you want to delete this card?')) return;
      try {
        const card = currentCards.find(c => c.id == id);
        if (card && card.image_url) {
          await NB.deleteCardImage(card.image_url);
        }
        const { error } = await supabaseClient.from('cards').delete().eq('id', id);
        if (error) throw error;
        NB.toast('Card deleted successfully.', 'success');
        loadCards();
      } catch (err) {
        console.error(err);
        NB.toast('Failed to delete card.', 'error');
      }
    }

    async function loadCards() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');
      
      try {
        const { data: cards, error } = await supabaseClient.from('cards').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        currentCards = cards;
        const tbody = document.getElementById('cards-table');
        
        if (cards && cards.length > 0) {
          tbody.innerHTML = cards.map((c, index) => `
            <tr class="border-b border-white/[0.04] hover:bg-[#0E839E]/[0.04] transition-colors">
              <td class="py-2 px-3 font-body text-sm text-gray-500">${index + 1}</td>
              <td class="py-2 px-3"><img src="${NB.img(c.image_url)}" class="w-12 h-12 object-cover rounded-lg border border-white/[0.1]"></td>
              <td class="py-2 px-3 font-body text-sm font-semibold text-gray-200">${NB.esc(c.name)}</td>
              <td class="py-2 px-3 font-body text-sm text-gray-400">${NB.esc(c.set_name || '-')}</td>
              <td class="py-2 px-3"><span class="px-2 py-1 text-[10px] font-bold border border-white/[0.1] rounded-lg bg-white/[0.05] uppercase ${NB.rarityClass(c.rarity)}">${NB.esc(c.rarity || 'Common')}</span></td>
              <td class="py-2 px-3 font-pixel text-[7px] text-gray-200">${NB.price(c.price)}</td>
              <td class="py-2 px-3 font-body text-sm text-gray-400">${NB.esc(c.condition || '-')}</td>
              <td class="py-2 px-3 font-pixel text-[#1FB5D6] text-[10px]">${c.is_featured ? '★' : '—'}</td>
              <td class="py-2 px-3 font-body text-sm font-bold ${c.is_sold ? 'text-[#E63946]' : 'text-[#1FB5D6]'}">${c.is_sold ? 'SOLD' : 'Available'}</td>
              <td class="py-2 px-3">
                <div class="flex gap-2">
                  <a href="/admin/card-form.html?id=${c.id}" class="text-[#1FB5D6] hover:text-[#0E839E] font-body text-sm font-semibold transition-colors">Edit</a>
                  <button onclick="deleteCard('${c.id}')" class="text-[#E63946] hover:text-[#EE3F3F] hover:bg-[#E63946]/10 px-2 rounded-lg font-body text-sm font-semibold transition-colors">Delete</button>
                </div>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="10" class="py-6 text-center font-body text-gray-500">No cards found.</td></tr>`;
        }

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        NB.toast('Error loading cards.', 'error');
      }
    }

    (async () => {
      const ctx = await NB.initAdmin('cards');
      if (!ctx) return;
      loadCards();
    })();
  </script>
</body>
</html>
