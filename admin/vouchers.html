<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANAGE VOUCHERS | Nooblax Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          teal: { DEFAULT: '#0E839E', light: '#1FB5D6', dark: '#0A6B82' },
          cream: { DEFAULT: '#F6D06F', light: '#FFDF85' },
          cherry: { DEFAULT: '#E63946', light: '#EE3F3F' },
          ink: { DEFAULT: '#1A1E24' },
          shell: { DEFAULT: '#ECEFF1' },
          base: { DEFAULT: '#FAFAFA', light: '#F4F6F8' }
        },
        fontFamily: {
          pixel: ['"Press Start 2P"', 'cursive'],
          body: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          sans: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"Space Grotesk"', 'ui-monospace', 'monospace']
        }
      }
    }
  }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="font-body bg-[#0B1120] text-gray-200">
  <!-- Admin mobile topbar -->
  <div id="admin-topbar"></div>
  <!-- Admin desktop sidebar -->
  <div id="admin-sidebar"></div>
  
  <!-- Main content area -->
  <div class="md:ml-64 min-h-screen bg-[#0B1120]">
    <div class="p-6 md:p-8 fade-in">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-white font-pixel text-sm">MANAGE VOUCHERS</h1>
        <a href="/admin/voucher-form.html" class="bg-gradient-to-r from-[#0E839E] to-[#1FB5D6] text-white font-pixel text-[9px] py-3 px-6 rounded-xl hover:shadow-[0_4px_20px_rgba(14,131,158,0.4)] transition-all duration-300">ADD VOUCHER</a>
      </div>
      
      <div id="loading" class="text-center py-10 font-pixel text-[10px] text-gray-500">LOADING VOUCHERS...</div>

      <div id="content" class="hidden">
        <div class="table-wrapper w-full border border-white/[0.06] rounded-2xl overflow-x-auto bg-white/[0.04] backdrop-blur-xl">
          <table class="w-full text-left border-collapse min-w-[700px]">
            <thead>
              <tr class="bg-white/[0.04] text-gray-400 font-pixel text-[7px]">
                <th class="py-3 px-3">CODE</th>
                <th class="py-3 px-3">DESCRIPTION</th>
                <th class="py-3 px-3">TYPE</th>
                <th class="py-3 px-3">VALUE</th>
                <th class="py-3 px-3">VALID FROM</th>
                <th class="py-3 px-3">VALID UNTIL</th>
                <th class="py-3 px-3">STATUS</th>
                <th class="py-3 px-3">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="vouchers-table">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script>
    async function deleteVoucher(id) {
      if (!confirm('Are you sure you want to delete this voucher?')) return;
      try {
        const { error } = await supabaseClient.from('vouchers').delete().eq('id', id);
        if (error) throw error;
        NB.toast('Voucher deleted successfully.', 'success');
        loadVouchers();
      } catch (err) {
        console.error(err);
        NB.toast('Failed to delete voucher.', 'error');
      }
    }

    function getVoucherStatus(v) {
      if (!v.is_active) return { text: 'Inactive', color: 'text-gray-500' };
      if (v.valid_until && new Date(v.valid_until) < new Date()) return { text: 'Expired', color: 'text-[#E63946]' };
      return { text: 'Active', color: 'text-[#1FB5D6] drop-shadow-[0_0_4px_rgba(31,181,214,0.3)]' };
    }

    async function loadVouchers() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');
      
      try {
        const { data: vouchers, error } = await supabaseClient.from('vouchers').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        const tbody = document.getElementById('vouchers-table');
        
        if (vouchers && vouchers.length > 0) {
          tbody.innerHTML = vouchers.map(v => {
            const status = getVoucherStatus(v);
            const valueDisplay = v.discount_type === 'percentage' ? `${v.discount_value}%` : NB.price(v.discount_value);
            return `
              <tr class="border-b border-white/[0.04] hover:bg-[#0E839E]/[0.04] transition-colors">
                <td class="py-2 px-3">
                  <span class="bg-[#F6D06F]/10 border border-[#F6D06F]/30 text-[#F6D06F] font-pixel text-[9px] px-3 py-1 rounded-lg">${NB.esc(v.code)}</span>
                </td>
                <td class="py-2 px-3 font-body text-sm text-gray-300">${NB.esc(v.description || '-')}</td>
                <td class="py-2 px-3 font-body text-sm capitalize text-gray-300">${NB.esc(v.discount_type)}</td>
                <td class="py-2 px-3 font-pixel text-[8px] text-gray-200">${valueDisplay}</td>
                <td class="py-2 px-3 font-body text-sm text-gray-400">${v.valid_from ? new Date(v.valid_from).toLocaleDateString() : '-'}</td>
                <td class="py-2 px-3 font-body text-sm text-gray-400">${v.valid_until ? new Date(v.valid_until).toLocaleDateString() : '-'}</td>
                <td class="py-2 px-3 font-body text-sm font-bold ${status.color}">${status.text}</td>
                <td class="py-2 px-3">
                  <div class="flex gap-2">
                    <a href="/admin/voucher-form.html?id=${v.id}" class="text-[#1FB5D6] hover:text-[#0E839E] font-body text-sm font-semibold transition-colors">Edit</a>
                    <button onclick="deleteVoucher('${v.id}')" class="text-[#E63946] hover:text-[#EE3F3F] hover:bg-[#E63946]/10 px-2 rounded-lg font-body text-sm font-semibold transition-colors">Delete</button>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="8" class="py-6 text-center font-body text-gray-500">No vouchers found.</td></tr>`;
        }

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        NB.toast('Error loading vouchers.', 'error');
      }
    }

    (async () => {
      const ctx = await NB.initAdmin('vouchers');
      if (!ctx) return;
      loadVouchers();
    })();
  </script>
</body>
</html>
