<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DASHBOARD | Nooblax Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          teal: { DEFAULT: '#0E839E', light: '#1FB5D6', dark: '#0A6B82' },
          cream: { DEFAULT: '#F6D06F', light: '#FFDF85' },
          cherry: { DEFAULT: '#E63946', light: '#EE3F3F' },
          ink: { DEFAULT: '#1A1E24' },
          shell: { DEFAULT: '#ECEFF1' },
          base: { DEFAULT: '#FAFAFA', light: '#F4F6F8' }
        },
        fontFamily: {
          pixel: ['"Press Start 2P"', 'cursive'],
          body: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          sans: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"Space Grotesk"', 'ui-monospace', 'monospace']
        }
      }
    }
  }
  </script>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/LOGO_NB.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="font-body bg-[#0B1120] text-gray-200">
  <!-- Admin mobile topbar -->
  <div id="admin-topbar"></div>
  <!-- Admin desktop sidebar -->
  <div id="admin-sidebar"></div>
  
  <!-- Main content area -->
  <div class="md:ml-64 min-h-screen bg-[#0B1120]">
    <div class="p-6 md:p-8 fade-in">
      <h1 class="text-white font-pixel text-sm mb-6">DASHBOARD</h1>
      
      <div id="loading" class="text-center py-10 font-pixel text-[10px] text-gray-500">LOADING DATA...</div>

      <div id="content" class="hidden">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
          <div class="bg-white/[0.04] backdrop-blur-xl rounded-2xl border border-white/[0.06] hover:border-[#0E839E]/30 hover:shadow-[0_8px_32px_rgba(14,131,158,0.15)] transition-all p-5">
            <div id="stat-total" class="font-pixel text-xl text-[#1FB5D6] drop-shadow-[0_0_8px_rgba(31,181,214,0.4)]">0</div>
            <div class="font-body text-xs text-gray-500 uppercase mt-1">Total Cards</div>
          </div>
          <div class="bg-white/[0.04] backdrop-blur-xl rounded-2xl border border-white/[0.06] hover:border-[#0E839E]/30 hover:shadow-[0_8px_32px_rgba(14,131,158,0.15)] transition-all p-5">
            <div id="stat-featured" class="font-pixel text-xl text-[#1FB5D6] drop-shadow-[0_0_8px_rgba(31,181,214,0.4)]">0</div>
            <div class="font-body text-xs text-gray-500 uppercase mt-1">Featured</div>
          </div>
          <div class="bg-white/[0.04] backdrop-blur-xl rounded-2xl border border-white/[0.06] hover:border-[#0E839E]/30 hover:shadow-[0_8px_32px_rgba(14,131,158,0.15)] transition-all p-5">
            <div id="stat-sold" class="font-pixel text-xl text-[#1FB5D6] drop-shadow-[0_0_8px_rgba(31,181,214,0.4)]">0</div>
            <div class="font-body text-xs text-gray-500 uppercase mt-1">Sold</div>
          </div>
          <div class="bg-white/[0.04] backdrop-blur-xl rounded-2xl border border-white/[0.06] hover:border-[#0E839E]/30 hover:shadow-[0_8px_32px_rgba(14,131,158,0.15)] transition-all p-5">
            <div id="stat-vouchers" class="font-pixel text-xl text-[#1FB5D6] drop-shadow-[0_0_8px_rgba(31,181,214,0.4)]">0</div>
            <div class="font-body text-xs text-gray-500 uppercase mt-1">Active Vouchers</div>
          </div>
        </div>

        <div class="flex gap-4 mb-8">
          <a href="/admin/card-form.html" class="bg-gradient-to-r from-[#0E839E] to-[#1FB5D6] text-white font-pixel text-[9px] py-3 px-6 rounded-xl hover:shadow-[0_4px_20px_rgba(14,131,158,0.4)] transition-all duration-300">ADD NEW CARD</a>
          <a href="/admin/voucher-form.html" class="bg-[#F6D06F]/10 border border-[#F6D06F]/30 text-[#F6D06F] rounded-xl font-pixel text-[9px] py-3 px-6 hover:bg-[#F6D06F]/20 transition-all duration-300">ADD VOUCHER</a>
        </div>

        <div>
          <h2 class="font-pixel text-[10px] text-white mb-4">RECENT CARDS</h2>
          <div class="table-wrapper w-full border border-white/[0.06] rounded-2xl overflow-x-auto bg-white/[0.04] backdrop-blur-xl">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-white/[0.04] text-gray-400 font-pixel text-[7px]">
                  <th class="py-3 px-3">IMAGE</th>
                  <th class="py-3 px-3">NAME</th>
                  <th class="py-3 px-3">SET</th>
                  <th class="py-3 px-3">RARITY</th>
                  <th class="py-3 px-3">PRICE</th>
                  <th class="py-3 px-3">STATUS</th>
                </tr>
              </thead>
              <tbody id="recent-cards">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/components.js"></script>
  <script>
    (async () => {
      const ctx = await NB.initAdmin('dashboard');
      if (!ctx) return;
      
      try {
        const [{ count: cardCount }, { count: featuredCount }, { count: soldCount }, { count: activeVoucherCount }, { data: recentCards }] = await Promise.all([
          supabaseClient.from('cards').select('*', { count: 'exact', head: true }),
          supabaseClient.from('cards').select('*', { count: 'exact', head: true }).eq('is_featured', true),
          supabaseClient.from('cards').select('*', { count: 'exact', head: true }).eq('is_sold', true),
          supabaseClient.from('vouchers').select('*', { count: 'exact', head: true }).eq('is_active', true),
          supabaseClient.from('cards').select('*').order('created_at', { ascending: false }).limit(5)
        ]);

        document.getElementById('stat-total').textContent = cardCount || 0;
        document.getElementById('stat-featured').textContent = featuredCount || 0;
        document.getElementById('stat-sold').textContent = soldCount || 0;
        document.getElementById('stat-vouchers').textContent = activeVoucherCount || 0;

        const tbody = document.getElementById('recent-cards');
        if (recentCards && recentCards.length > 0) {
          tbody.innerHTML = recentCards.map(c => `
            <tr class="border-b border-white/[0.04] hover:bg-[#0E839E]/[0.04] cursor-pointer transition-colors" onclick="window.location.href='/admin/card-form.html?id=${c.id}'">
              <td class="py-2 px-3"><img src="${NB.img(c.image_url)}" class="w-10 h-10 object-cover rounded-lg border border-white/[0.1]"></td>
              <td class="py-2 px-3 font-body text-sm font-semibold text-gray-200">${NB.esc(c.name)}</td>
              <td class="py-2 px-3 font-body text-sm text-gray-400">${NB.esc(c.set_name || '-')}</td>
              <td class="py-2 px-3"><span class="px-2 py-1 text-[10px] font-bold border border-white/[0.1] rounded-lg bg-white/[0.05] uppercase ${NB.rarityClass(c.rarity)}">${NB.esc(c.rarity || 'Common')}</span></td>
              <td class="py-2 px-3 font-pixel text-[8px] text-gray-200">${NB.price(c.price)}</td>
              <td class="py-2 px-3 font-body text-sm font-bold ${c.is_sold ? 'text-[#E63946]' : 'text-[#1FB5D6]'}">${c.is_sold ? 'SOLD' : 'Available'}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center font-body text-gray-500">No cards found.</td></tr>`;
        }

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

      } catch (err) {
        NB.toast('Error loading dashboard data.', 'error');
        console.error(err);
      }
    })();
  </script>
</body>
</html>
